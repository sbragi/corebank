# Debezium Server: PostgreSQL -> Redis Streams (no Kafka)
debezium.sink.type=redis
debezium.sink.redis.address=redis:6379
debezium.sink.redis.db.index=0
debezium.sink.redis.message.format=compact

# Durable offsets and schema history in Redis
debezium.source.offset.storage=io.debezium.storage.redis.offset.RedisOffsetBackingStore
debezium.source.offset.storage.redis.address=redis:6379
debezium.source.offset.storage.redis.key=corebank:debezium:offsets

debezium.source.schema.history.internal=io.debezium.storage.redis.history.RedisSchemaHistory
debezium.source.schema.history.internal.redis.address=redis:6379

# PostgreSQL source
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=corebank
debezium.source.database.password=corebank
debezium.source.database.dbname=corebank
debezium.source.topic.prefix=corebank
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=corebank_cdc
debezium.source.publication.name=corebank_publication
debezium.source.publication.autocreate.mode=filtered
debezium.source.table.include.list=public.account

debezium.source.snapshot.mode=initial

debezium.source.decimal.handling.mode=string

# Emit the current row instead of the Debezium envelope
debezium.transforms=unwrap
debezium.transforms.unwrap.type=io.debezium.transforms.ExtractNewRecordState
debezium.transforms.unwrap.delete.tombstone.handling.mode=rewrite

debezium.format.key=json
debezium.format.key.schemas.enable=false
debezium.format.value=json
debezium.format.value.schemas.enable=false
